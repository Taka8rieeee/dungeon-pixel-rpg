<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>地牢像素 RPG</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game" width="480" height="288"></canvas>

    <div id="hud">
      <div class="hud-block">
        <div id="floorLabel">第 1 层</div>
        <div id="hpBar"><div id="hpFill"></div><span id="hpText">60 / 60</span></div>
      </div>
      <div class="hud-block right">
        <span id="weaponLabel">铁剑</span>
        <span id="potionLabel">药水 ×1</span>
        <span id="goldLabel">金币 0</span>
        <span id="crystalLabel">晶石 0</span>
      </div>
    </div>

    <div id="stats"></div>
    <div id="log"></div>
    <canvas id="minimap"></canvas>

    <div id="overlay" class="hidden"><div id="overlayInner"></div></div>
    <!-- 联机昵称输入：Electron 内核不支持 window.prompt，必须自己画 -->
    <div id="netDialog" class="hidden">
      <form id="netForm" autocomplete="off">
        <h2>联机同屏</h2>
        <p class="net-hint">输入名字，最多 4 人一起下地牢</p>
        <input id="netName" type="text" maxlength="8" placeholder="你的名字" value="勇者" />
        <input id="netServer" type="text" placeholder="服务器地址（留空＝当前这台的服务器）" />
        <div id="netAddrBox" class="hidden">
          <span class="net-addr-label">让队友把服务器地址填成这个：</span>
          <div class="net-addr-row">
            <code id="netAddr"></code>
            <button type="button" id="netCopy">复制</button>
          </div>
          <span class="net-addr-tip" id="netAddrTip"></span>
        </div>
        <div class="net-actions">
          <button type="submit" class="net-primary">进入地牢</button>
          <button type="button" id="netCancel">取消</button>
        </div>
      </form>
    </div>
    <div id="crash" class="hidden"></div>
  </div>

  <script src="/src/rng.js"></script>
  <script src="/src/mapgen.js"></script>
  <script src="/src/fov.js"></script>
  <script src="audio.js"></script>
  <script src="engine.js"></script>
  <script src="client.js"></script>
</body>
</html>
